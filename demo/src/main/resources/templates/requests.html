<!DOCTYPE html>
<html lang="eu" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesio eskaerak - Network Topology</title>

  <!-- Google-ko letrak -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- ── GOIKO BARRA ── -->
  <header class="topbar">
    <span class="logo" th:text="#{requests.title}">Sesio eskaerak</span>
    <div class="topbar-sep"></div>

    <!-- Hizkuntza hautatzailea -->
    <div class="lang-selector">
      <button class="lang-btn" id="lang-btn">
        <span id="lang-code" th:text="#{nav.lang}">EU</span>
      </button>
      <div class="lang-dropdown" id="lang-dropdown">
        <div class="lang-option" data-lang="eu">
          <span>Euskera</span>
        </div>
        <div class="lang-option" data-lang="en">
          <span>English</span>
        </div>
      </div>
    </div>

    <a href="/" class="nav-btn" th:text="#{nav.topology}">Sare Topologia</a>
    <a href="/apps" class="nav-btn" th:text="#{nav.apps}">Aplikazioak</a>
  </header>

  <!-- Layout sinplea: taula bakarrik -->
  <main class="requests-main-fullwidth">
    <h1 th:text="#{requests.title}">Sesio eskaerak</h1>

    <div class="table-container">
      <div class="table-header">
        <h2 th:text="#{requests.list}">Zerrenda</h2>
        <div class="app-count">
          <span id="session-count-number">—</span>
          <span th:text="#{requests.count.suffix}">eskaera</span>
        </div>
      </div>

      <table class="apps-table">
        <thead>
          <tr>
            <th th:text="#{requests.table.sessionId}">Sesio IDa</th>
            <th th:text="#{requests.table.sourceApp}">Jatorrizko APP</th>
            <th th:text="#{requests.table.destApp}">Helmugako APP</th>
            <th th:text="#{requests.table.securityLevel}">Segurtasun maila</th>
            <th th:text="#{requests.table.startTime}">Hasiera ordua</th>
            <th th:text="#{requests.table.status}">Egoera</th>
            <th th:text="#{requests.table.endTime}">Amaiera ordua</th>
          </tr>
        </thead>
        <tbody id="sessions-table-body">
          <tr class="loading-row">
            <td colspan="7" th:text="#{requests.loading}">Datuak kargatzen...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script type="module">
    import { initLanguageSelector } from '/js/languageSelector.js';
    initLanguageSelector('requests');
  </script>

  <script th:inline="javascript">
    window.requestsI18n = {
      empty: /*[[#{requests.empty}]]*/ "Ez dago sesio eskaerarik",
      error: /*[[#{requests.error}]]*/ "Errorea datuak kargatzean",
      close: /*[[#{requests.detail.close}]]*/ "Itxi",

      // Detail panel labels
      securityLevel: /*[[#{requests.detail.securityLevel}]]*/ "Segurtasun maila",
      status: /*[[#{requests.detail.status}]]*/ "Egoera",
      details: /*[[#{requests.detail.title}]]*/ "Xehetasunak",

      // L1
      l1KmsSrc: /*[[#{requests.detail.l1.kmsSrc}]]*/ "Jatorrizko KMS",
      l1KmsDst: /*[[#{requests.detail.l1.kmsDst}]]*/ "Helmugako KMS",

      // L2
      l2RelayPath: /*[[#{requests.detail.l2.relayPath}]]*/ "Relay bidea",
      l2Hop: /*[[#{requests.detail.l2.hop}]]*/ "Jauzia",

      // L3
      l3Receiver: /*[[#{requests.detail.l3.receiver}]]*/ "Receiver",
      l3Passive: /*[[#{requests.detail.l3.passive}]]*/ "Passive",
      l3Relay: /*[[#{requests.detail.l3.relay}]]*/ "Relay",

      // L4
      l4Initiator: /*[[#{requests.detail.l4.initiator}]]*/ "Initiator",
      l4Responder: /*[[#{requests.detail.l4.responder}]]*/ "Responder"
    };
  </script>

  <script>
    // Orrialdea kargatzean, datuak eskatu
    window.addEventListener('load', () => {
      loadSessions();
    });

    function loadSessions() {
      fetch('/api/sessions')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(sessions => {
          renderSessionsTable(sessions);
          updateSessionCount(sessions.length);
        })
        .catch(error => {
          console.error('Errorea sesioak kargatzean:', error);
          showError();
        });
    }

    function renderSessionsTable(sessions) {
      const tbody = document.getElementById('sessions-table-body');
      tbody.innerHTML = '';

      if (sessions.length === 0) {
        tbody.innerHTML = `
        <tr class="loading-row">
          <td colspan="7">${window.requestsI18n.empty}</td>
        </tr>
      `;
        return;
      }

      sessions.forEach((session, index) => {
        // Errenkada normala
        const row = document.createElement('tr');
        row.style.cursor = 'pointer';
        row.dataset.sessionId = session.sessionId;  
        row.dataset.index = index;  

        const startTime = session.startTime ? new Date(session.startTime).toLocaleString() : '—';
        const endTime = session.endTime ? new Date(session.endTime).toLocaleString() : '—';

        row.innerHTML = `
        <td>${session.sessionId}</td>
        <td>${session.sourceAppId || '—'}</td>
        <td>${session.destAppId || '—'}</td>
        <td>L${session.securityLevel || '—'}</td>
        <td>${startTime}</td>
        <td>${session.status || '—'}</td>
        <td>${endTime}</td>
      `;

        // Klik event-a
        row.addEventListener('click', () => {
          toggleDetailPanel(row, session.sessionId);
        });

        tbody.appendChild(row);
      });
    }

    function updateSessionCount(count) {
      document.getElementById('session-count-number').textContent = count;
    }

    function showError() {
      const tbody = document.getElementById('sessions-table-body');
      tbody.innerHTML = `
      <tr class="loading-row">
        <td colspan="7">${window.requestsI18n.error}</td>
      </tr>
    `;
    }



    let currentDetailRow = null;  // Detaile panela irekita dagoen errenkada

    function toggleDetailPanel(row, sessionId) {
      // Dagoeneko irekita badago, itxi
      if (currentDetailRow && currentDetailRow.dataset.sessionId === sessionId) {
        closeDetailPanel();
        return;
      }

      // Beste bat irekita badago, itxi lehenik
      if (currentDetailRow) {
        closeDetailPanel();
      }

      // Xehetasunak kargatu eta erakutsi
      loadSessionDetail(row, sessionId);
    }

    function loadSessionDetail(row, sessionId) {
      fetch(`/api/sessions/${sessionId}`)
        .then(response => response.json())
        .then(detail => {
          showDetailPanel(row, detail);
        })
        .catch(error => {
          console.error('Errorea xehetasunak kargatzean:', error);
        });
    }

    function showDetailPanel(row, detail) {
      // Detaile errenkada berria sortu
      const detailRow = document.createElement('tr');
      detailRow.classList.add('detail-row');
      detailRow.dataset.sessionId = detail.sessionId;

      const detailCell = document.createElement('td');
      detailCell.setAttribute('colspan', '7');

      // Edukia sortu
      let html = `
      <div class="detail-panel-content">
        <div class="detail-panel-header">
          <div class="detail-panel-title">
            <div class="detail-panel-dot"></div>
            <span>${detail.sessionId}</span>
          </div>
          <button class="close-btn" onclick="closeDetailPanel()">
            ${window.requestsI18n.close || 'Itxi'}
          </button>
        </div>
        
        <div class="section-label">${window.requestsI18n.securityLevel}: L${detail.securityLevel}</div>
        <div class="section-label">${window.requestsI18n.status}: ${detail.status}</div>
        <div style="margin: 20px 0;">
          <div class="section-label">Topologia:</div>
          <div id="topology-graph-container" style="width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);"></div>
        </div>
    `;

      // Xehetasunak gehitu status-en arabera
      if (detail.status === 'Level configured for init' ||
        detail.status === 'SLA assigned for target' ||
        detail.status === 'Level configured for target') {

        html += `<div class="section-label" style="margin-top: 20px;">${window.requestsI18n.details}</div>`;

        // L1
        if (detail.securityLevel === 1 && detail.kmsSrcId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l1KmsSrc}</td><td>${detail.kmsSrcId}</td></tr>
            <tr><td>${window.requestsI18n.l1KmsDst}</td><td>${detail.kmsDstId}</td></tr>
          </table>
        `;
        }

        // L2
        if (detail.securityLevel === 2 && detail.l2Hops) {
          html += `<div style="margin-top: 10px;"><strong>${window.requestsI18n.l2RelayPath}:</strong></div>`;
          detail.l2Hops.forEach(hop => {
            html += `
            <div class="kms-card">
              <div class="kms-id">${window.requestsI18n.l2Hop} ${hop.hopOrder}: ${hop.kmsId}</div>
            </div>
          `;
          });
        }

        // L3
        if (detail.securityLevel === 3 && detail.receiverId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l3Receiver}</td><td>${detail.receiverId}</td></tr>
            <tr><td>${window.requestsI18n.l3Passive}</td><td>${detail.passiveId}</td></tr>
            <tr><td>${window.requestsI18n.l3Relay}</td><td>${detail.relayId}</td></tr>
          </table>
        `;
        }

        // L4
        if (detail.securityLevel === 4 && detail.initiatorId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l4Initiator}</td><td>${detail.initiatorId}</td></tr>
            <tr><td>${window.requestsI18n.l4Responder}</td><td>${detail.responderId}</td></tr>
          </table>
        `;
        }
      }

      html += '</div>';
      detailCell.innerHTML = html;
      detailRow.appendChild(detailCell);

      // Errenkadaren ondoren txertatu
      row.parentNode.insertBefore(detailRow, row.nextSibling);

      // Errenkada hautatu bezala markatu
      row.classList.add('selected');

      // Gorde erreferentzia
      currentDetailRow = detailRow;
      if (detail.topology) {
        setTimeout(() => {
          renderTopologyGraph(detail);
        }, 100);
      }
    }

    function closeDetailPanel() {
      if (currentDetailRow) {
        // Errenkada aurkitu eta 'selected' klase kendu
        const sessionId = currentDetailRow.dataset.sessionId;
        const sessionRow = document.querySelector(`tr[data-session-id="${sessionId}"]`);
        if (sessionRow) {
          sessionRow.classList.remove('selected');
        }

        // Detaile panela kendu
        currentDetailRow.remove();
        currentDetailRow = null;
      }
    }
    /**
     * Topology datuak prozesatu eta Site-en arabera antolatu
     */
    function processTopologyData(topology) {
      const siteMap = new Map();

      // Site nodoak bilatu
      topology.nodes
        .filter(n => n.node_type === 'CN' || n.node_type === 'QN')
        .forEach(site => {
          siteMap.set(site.id, {
            id: site.id,
            type: site.node_type,
            vkms: site.vKMS,
            kms: []
          });
        });

      // KMS nodoak Site-ei esleitu
      topology.nodes
        .filter(n => n.node_type === 'KMS')
        .forEach(kms => {
          const site = siteMap.get(kms.site);
          if (site) {
            site.kms.push(kms.id);
          }
        });

      return Array.from(siteMap.values());
    }
    function renderTopologyGraph(detail) {
      const container = document.getElementById('topology-graph-container');
      if (!container) return;

      const topology = detail.topology;
      if (!topology || !topology.nodes) return;

      // Garbitu aurreko SVG-a
      d3.select('#topology-graph-container').selectAll('*').remove();

      // Datuak prozesatu
      const sites = processTopologyData(topology);

      const width = container.clientWidth;
      const height = 500;

      // SVG sortu
      const svg = d3.select('#topology-graph-container')
        .append('svg')
        .attr('width', width)
        .attr('height', height);

      const g = svg.append('g');

      // Zoom
      const zoom = d3.zoom()
        .scaleExtent([0.5, 2])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom);

      // Classical links marraztu (Site artean)
      // GARRANTZITSUA: JSON-ean "classical-links" da (hyphen), ez classicalLinks
      const classicalLinks = (topology['classical-links'] || []).map(link => ({
        source: link.source,
        target: link.target
      }));

      console.log('Sites:', sites.map(s => s.id));
      console.log('Classical Links:', classicalLinks);

      const simulation = d3.forceSimulation(sites)
        .force('link', d3.forceLink(classicalLinks).id(d => d.id).distance(200))
        .force('charge', d3.forceManyBody().strength(-2500))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(150))
        .alpha(2)
        .alphaDecay(0.01);

      // Classical links (Site artean)
      const links = g.append('g')
        .selectAll('line')
        .data(classicalLinks)
        .enter()
        .append('line')
        .attr('class', 'classical-link')
        .attr('stroke', '#3b82f6')
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 0.4);

      // Site kaxak
      // Drag behavior definitu
      const drag = d3.drag()
        .on('start', function (event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on('drag', function (event, d) {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on('end', function (event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        });

      // Site kaxak
      const siteGroups = g.append('g')
        .selectAll('g')
        .data(sites)
        .enter()
        .append('g')
        .attr('class', 'site-group')
        .style('cursor', 'grab')
        .call(drag);

      // Site kaxak (errektangelua)
      siteGroups.append('rect')
        .attr('class', 'site-box')
        .attr('width', 150)
        .attr('height', 100)
        .attr('x', -75)
        .attr('y', -50)
        .attr('rx', 8)
        .attr('fill', d => d.type === 'QN' ? '#f5f3ff' : '#eff6ff')
        .attr('stroke', d => d.type === 'QN' ? '#7c3aed' : '#2563eb')
        .attr('stroke-width', 2);

      // Site izena (goian)
      siteGroups.append('text')
        .attr('class', 'site-label')
        .attr('x', 0)
        .attr('y', -30)
        .attr('text-anchor', 'middle')
        .attr('font-size', '12px')
        .attr('font-weight', '600')
        .attr('fill', '#1a1d2e')
        .text(d => d.id);

      // vKMS (behean ezkerrean)
     siteGroups.append('circle')
        .attr('class', 'vkms-node')
        .attr('data-site-id', d => d.id)  
        .attr('cx', 35)
        .attr('cy', 15)
        .attr('r', 18)
      
      siteGroups.append('text')
        .attr('x', 35)
        .attr('y', 19)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('font-size', '7px')
        .attr('font-weight', '700')
        .attr('fill', '#000000')
        .attr('pointer-events', 'none')
        .text(d => d.vkms);
      
      // vKMS (eskuinean)
      siteGroups.append('circle')
        .attr('class', 'vkms-node')
        .attr('cx', 35)  // Eskuinean
        .attr('cy', 15)  // Behean
        .attr('r', 18)
        .attr('fill', '#d1fae5')
        .attr('stroke', '#10b981')
        .attr('stroke-width', 2);
      
      siteGroups.append('text')
        .attr('x', 35)
        .attr('y', 19)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('font-size', '7px')
        .attr('font-weight', '700')
        .attr('fill', '#000000')
        .attr('pointer-events', 'none')
        .text(d => d.vkms);
      
      // KMS-ak (ezkerrean, goitik hasita)
      siteGroups.each(function(d) {
        const group = d3.select(this);
        const kmsCount = d.kms.length;
        
        d.kms.forEach((kmsId, i) => {
          // Hasi goitik (-20) eta behera joan
          const yPos = -20 + (i * 35);
          
          group.append('circle')
            .attr('class', 'kms-node')
            .attr('data-kms-id', kmsId)
            .attr('cx', -35)  // Ezkerrean
            .attr('cy', yPos + 15)
            .attr('r', 18)
            .attr('fill', '#fef3c7')
            .attr('stroke', '#f59e0b')
            .attr('stroke-width', 2);
          
          group.append('text')
            .attr('x', -35)
            .attr('y', yPos + 19)
            .attr('text-anchor', 'middle')
            .attr('font-size', '7px')
            .attr('font-weight', '600')
            .attr('fill', '#78350f')
            .text(kmsId);
        });
      });

      // Simulazioa tick
      simulation.on('tick', () => {
        links
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        siteGroups.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Gelditu 2 segundo ondoren
      setTimeout(() => {
        simulation.stop();
        // Nabarmentzeak aplikatu
        applyHighlights(detail, g, topology);
      }, 2000);
    }

    function applyHighlights(detail, g, topology) {
      const secLevel = detail.securityLevel;

      if (secLevel === 1) {
        highlightL1(detail, g);
      } else if (secLevel === 2) {
        highlightL2(detail, g);
      } else if (secLevel === 3) {
        highlightL3(detail, g, topology);
      } else if (secLevel === 4) {
        highlightL4(detail, g, topology);
      }
    }

    function highlightL1(detail, g) {
      const kmsSrc = detail.kmsSrcId;
      const kmsDst = detail.kmsDstId;

      if (kmsSrc) {
        highlightKMSNode(g, kmsSrc, '#3b82f6', 'Source');
      }
      if (kmsDst) {
        highlightKMSNode(g, kmsDst, '#10b981', 'Dest');
      }
    }

    function highlightL2(detail, g) {
      if (!detail.l2Hops) return;

      const colors = ['#3b82f6', '#eab308', '#10b981'];
      const labels = ['Hop 1', 'Hop 2', 'Hop 3'];

      detail.l2Hops.forEach((hop, i) => {
        const color = colors[i % colors.length];
        const label = labels[i] || `Hop ${i + 1}`;
        highlightKMSNode(g, hop.kmsId, color, label);
      });
    }

    function highlightL3(detail, g, topology) {
      const receiverSite = findSiteByVkms(topology, detail.receiverId);
      const passiveSite = findSiteByVkms(topology, detail.passiveId);
      const relaySite = findSiteByVkms(topology, detail.relayId);

      // Rolak konbinatu Site berean badaude
      const siteRoles = {};
      
      if (receiverSite) {
        if (!siteRoles[receiverSite]) siteRoles[receiverSite] = [];
        siteRoles[receiverSite].push({role: 'Receiver', color: '#3b82f6'});
      }
      if (passiveSite) {
        if (!siteRoles[passiveSite]) siteRoles[passiveSite] = [];
        siteRoles[passiveSite].push({role: 'Passive', color: '#eab308'});
      }
      if (relaySite) {
        if (!siteRoles[relaySite]) siteRoles[relaySite] = [];
        siteRoles[relaySite].push({role: 'Relay', color: '#10b981'});
      }
      
      // Site bakoitzeko rol guztiak konbinatu
      Object.entries(siteRoles).forEach(([siteId, roles]) => {
        const combinedLabel = roles.map(r => r.role).join(' + ');
        const primaryColor = roles[0].color;  // Lehenengo kolorea erabili
        highlightVKMSNode(g, siteId, primaryColor, combinedLabel);
      });
    }

    function highlightL4(detail, g, topology) {
      const initiatorSite = findSiteByVkms(topology, detail.initiatorId);
      const responderSite = findSiteByVkms(topology, detail.responderId);

      if (initiatorSite) {
        highlightVKMSNode(g, initiatorSite, '#3b82f6', 'Initiator');
      }
      if (responderSite) {
        highlightVKMSNode(g, responderSite, '#10b981', 'Responder');
      }
    }

    // Laguntzaileak
    function highlightKMSNode(g, kmsId, color, label) {
      g.selectAll('.kms-node')
        .filter(function () {
          return d3.select(this).attr('data-kms-id') === kmsId;
        })
        .attr('stroke', color)
        .attr('stroke-width', 3)
        .style('filter', `drop-shadow(0 0 6px ${color}99)`);

      // Label gehitu
      const node = g.selectAll('.kms-node')
        .filter(function () {
          return d3.select(this).attr('data-kms-id') === kmsId;
        });

      if (!node.empty()) {
        const cx = parseFloat(node.attr('cx'));
        const cy = parseFloat(node.attr('cy'));

        node.each(function () {
          const parent = this.parentNode;
          d3.select(parent)
            .append('text')
            .attr('class', 'highlight-label')
            .attr('x', cx + 20)
            .attr('y', cy + 4)
            .attr('font-size', '10px')
            .attr('font-weight', '600')
            .attr('fill', color)
            .text(label);
        });
      }
    }

    function highlightSiteBox(g, siteId, color, label) {
      g.selectAll('.site-group')
        .filter(d => d.id === siteId)
        .select('.site-box')
        .attr('stroke', color)
        .attr('stroke-width', 4)
        .style('filter', `drop-shadow(0 0 10px ${color}99)`);

      // Label gehitu Site izenaren ondoan
      g.selectAll('.site-group')
        .filter(d => d.id === siteId)
        .append('text')
        .attr('class', 'highlight-label')
        .attr('x', 0)
        .attr('y', -45)
        .attr('text-anchor', 'middle')
        .attr('font-size', '11px')
        .attr('font-weight', '700')
        .attr('fill', color)
        .text(`[${label}]`);
    }

    function findSiteByVkms(topology, vkmsId) {
      const node = topology.nodes.find(n => n.vKMS === vkmsId && (n.node_type === 'CN' || n.node_type === 'QN'));
      return node ? node.id : null;
    }

    function highlightVKMSNode(g, siteId, color, label) {
      const vkmsNode = g.selectAll('.vkms-node')
        .filter(function() {
          return d3.select(this).attr('data-site-id') === siteId;
        });
      
      vkmsNode
        .attr('stroke', color)
        .attr('stroke-width', 3)
        .style('filter', `drop-shadow(0 0 8px ${color}99)`);
      
      // Label gehitu
      if (!vkmsNode.empty() && label) {
        const cx = parseFloat(vkmsNode.attr('cx'));
        const cy = parseFloat(vkmsNode.attr('cy'));
        
        vkmsNode.each(function() {
          const parent = this.parentNode;
          d3.select(parent)
            .append('text')
            .attr('class', 'highlight-label')
            .attr('x', cx + 25)
            .attr('y', cy + 4)
            .attr('font-size', '10px')
            .attr('font-weight', '600')
            .attr('fill', color)
            .text(label);
        });
      }
    }

  </script>

</body>

</html>
