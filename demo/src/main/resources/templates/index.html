<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Topology</title>

  <!-- Google-ko letrak -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- D3 liburutegia CDNtik -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ── GOIKO BARRA ── -->
  <header class="topbar">
    <span class="logo">Network Topology</span>
    <div class="topbar-sep"></div>
    <a href="/apps"     class="nav-btn"><span class="nav-btn-icon">⊞</span>See Apps</a>
    <a href="/requests" class="nav-btn"><span class="nav-btn-icon">↔</span>See Requests</a>
  </header>

  <main class="main">

    <!-- SVG grafoaren Canvas-a -->
    <div class="canvas-wrap">
      <svg id="graph-svg"></svg>

      <!-- Aurkibidea -->
      <div class="legend">
        <div class="legend-title">Nodo motak</div>
        <div class="legend-row">
          <svg class="legend-icon" viewBox="0 0 26 26">
            <circle cx="13" cy="13" r="11" fill="var(--cn-bg)" stroke="var(--cn-color)" stroke-width="1.8"/>
            <text x="13" y="17" text-anchor="middle" font-size="10" fill="var(--cn-color)" font-family="DM Mono">C</text>
          </svg>
          Nodo klasikoa
        </div>
        <div class="legend-row">
          <svg class="legend-icon" viewBox="0 0 26 26">
            <rect x="2" y="2" width="22" height="22" rx="4" fill="var(--qn-bg)" stroke="var(--qn-color)" stroke-width="1.8"/>
            <text x="13" y="17" text-anchor="middle" font-size="10" fill="var(--qn-color)" font-family="DM Mono">Q</text>
          </svg>
          Nodo kuantikoa
        </div>
        <div class="legend-sep"></div>
        <div class="legend-title">Lotura motak</div>
        <div class="legend-row">
          <div class="legend-line" style="background: var(--cl-color)"></div>
          Lotura klasikoa
        </div>
        <div class="legend-row">
          <div class="legend-dashed"></div>
          Lotura kuantikoa
        </div>
      </div>
    </div>

    <!-- Informaziorako panel laterala -->
    <aside class="side-panel">

      <div class="panel-header">
        <div class="panel-dot" id="panel-dot"></div>
        Informazioa
      </div>

      <!-- Estatistikak -->
      <div class="stats-block">
        <div class="stat-cell">
          <div class="stat-label">
            <div class="stat-dot" style="background: var(--cn-color)"></div>
            Nodo klasiko kopurua:
          </div>
          <div class="stat-number" id="stat-cn">—</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">
            <div class="stat-dot" style="background: var(--qn-color)"></div>
            Nodo kuantiko kopurua:
          </div>
          <div class="stat-number" id="stat-qn">—</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">
            <div class="stat-dot" style="background: var(--cl-color)"></div>
            Lotura klasiko kopurua:
          </div>
          <div class="stat-number" id="stat-cl">—</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">
            <div class="stat-dot" style="background: var(--ql-color)"></div>
            Lotura kuantiko kopurua:
          </div>
          <div class="stat-number" id="stat-ql">—</div>
        </div>
      </div>

      <!-- Panel dinamikoa -->
      <div class="panel-body" id="panel-body"></div>

    </aside>
  </main>
  <script type="module" src="/js/main.js"></script>

</body>
</html>
