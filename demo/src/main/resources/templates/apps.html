<!DOCTYPE html>
<html lang="eu" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikazioak - Network Topology</title>

  <!-- Google-ko letrak -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- ── GOIKO BARRA ── -->
  <header class="topbar">
    <span class="logo" th:text="#{title.apps}">Registered Applications</span>
    <div class="topbar-sep"></div>
    <!-- Hizkuntza hautatzailea -->
    <div class="lang-selector">
      <button class="lang-btn" id="lang-btn">
        <span id="lang-code">EU</span>
      </button>
      <div class="lang-dropdown" id="lang-dropdown">
        <div class="lang-option" data-lang="eu">
          <span>Euskera</span>
        </div>
        <div class="lang-option" data-lang="en">
          <span>English</span>
        </div>
      </div>
    </div>
    <a href="/" class="nav-btn" th:text="#{nav.topology}">Sare Topologia</a>
    <a href="/requests" class="nav-btn" th:text="#{nav.requests}">Sesio eskaerak</a>
  </header>

  <!-- Taula -->
  <main class="apps-main">
    <h1 th:text="#{apps.title}">Aplikazioak</h1>

    <!-- Taularen edukiontzia -->
    <div class="table-container">

      <!-- Izenburu eta kontagailu goiburua -->
      <div class="table-header">
        <h2 th:text="#{apps.list}">Zerrenda</h2>
        <div class="app-count">
          <span id="app-count-number">—</span>
          <span th:text="#{apps.count.suffix}">aplikazio</span>
        </div>
      </div>

      <!-- Taula -->
      <table class="apps-table">
        <thead>
          <tr>
            <th th:text="#{apps.table.id}">ID</th>
            <th th:text="#{apps.table.site}">Site</th>
            <th th:text="#{apps.table.vkms}">vKMS</th>
            <th th:text="#{apps.table.requests}">Eskaerak</th>
          </tr>
        </thead>
        <tbody id="apps-table-body">
          <tr class="loading-row">
            <td colspan="4" th:text="#{apps.loading}">Datuak kargatzen...</td>
          </tr>
        </tbody>
      </table>

    </div>

  </main>
  <script>
  // Hizkuntza hautatzailearen logika
  const langBtn = document.getElementById('lang-btn');
  const langDropdown = document.getElementById('lang-dropdown');
  const langCode = document.getElementById('lang-code');

  // Dropdown irekitzeko/ixteko
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langDropdown.classList.toggle('active');
  });

  // Hizkuntza bat aukeratzean
  document.querySelectorAll('.lang-option').forEach(option => {
    option.addEventListener('click', () => {
      const lang = option.dataset.lang;
      window.location.href = '/apps?lang=' + lang;
    });
  });

  // Kanpoan klik egitean dropdown itxi
  document.addEventListener('click', () => {
    langDropdown.classList.remove('active');
  });

  // Hizkuntza aktiboa ikusi eta botoia eguneratu
  const urlParams = new URLSearchParams(window.location.search);
  const currentLang = urlParams.get('lang') || 'eu';
  langCode.textContent = currentLang.toUpperCase();
  
  // Dropdown-eko hautaketa markatu
  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.lang === currentLang);
  });
</script>

<script th:inline="javascript">
  window.appsI18n = {
    empty: /*[[#{apps.empty}]]*/ "Ez dago aplikaziorik erregistratuta",
    error: /*[[#{apps.error}]]*/ "Errorea datuak kargatzean"
  };
</script>

  <script>
    // Orrialdea kargatzean, datuak eskatu
    window.addEventListener('load', () => {
      loadApps();
    });

    /**
     * API-tik app guztiak kargatu eta taulan erakutsi
     */
    function loadApps() {
      fetch('/api/apps')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(apps => {
          renderAppsTable(apps);
          updateAppCount(apps.length);
        })
        .catch(error => {
          console.error('Errorea aplikazioak kargatzean:', error);
          showError();
        });
    }

    // App-en zerrenda taulan bistaratu

    function renderAppsTable(apps) {
      const tbody = document.getElementById('apps-table-body');

      // Taularen edukina garbitu (loading mezua kendu)
      tbody.innerHTML = '';

      if (apps.length === 0) {
    tbody.innerHTML = `
      <tr class="loading-row">
        <td colspan="4">${window.appsI18n.empty}</td>
      </tr>
    `;
    return;
  }

      // App bakoitzeko errenkada bat sortu
      apps.forEach(app => {
        const row = document.createElement('tr');

        row.innerHTML = `
      <td>${app.id}</td>
      <td>${app.siteId || '—'}</td>
      <td>${app.vkmsId || '—'}</td>
      <td>${app.requestCount}</td>
    `;

        tbody.appendChild(row);
      });
    }

    // App kopurua eguneratu goiburuan

    function updateAppCount(count) {
      document.getElementById('app-count-number').textContent = count;
    }

    // Errore mezua erakutsi datuen karga huts egiten badu

    function showError() {
      const tbody = document.getElementById('apps-table-body');
      tbody.innerHTML = `
    <tr class="loading-row">
      <td colspan="4">${window.appsI18n.error}</td>
    </tr>
  `;
    }

  </script>
</body>

</html>
