<!DOCTYPE html>
<html lang="eu" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesio eskaerak - Network Topology</title>

  <!-- Google-ko letrak -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- ── GOIKO BARRA ── -->
  <header class="topbar">
    <span class="logo" th:text="#{requests.title}">Sesio eskaerak</span>
    <div class="topbar-sep"></div>

    <!-- Hizkuntza hautatzailea -->
    <div class="lang-selector">
      <button class="lang-btn" id="lang-btn">
        <span id="lang-code" th:text="#{nav.lang}">EU</span>
      </button>
      <div class="lang-dropdown" id="lang-dropdown">
        <div class="lang-option" data-lang="eu">
          <span>Euskera</span>
        </div>
        <div class="lang-option" data-lang="en">
          <span>English</span>
        </div>
      </div>
    </div>

    <a href="/" class="nav-btn" th:text="#{nav.topology}">Sare Topologia</a>
    <a href="/apps" class="nav-btn" th:text="#{nav.apps}">Aplikazioak</a>
  </header>

  <!-- Layout sinplea: taula bakarrik -->
  <main class="requests-main-fullwidth">
    <h1 th:text="#{requests.title}">Sesio eskaerak</h1>

    <div class="table-container">
      <div class="table-header">
        <h2 th:text="#{requests.list}">Zerrenda</h2>
        <div class="app-count">
          <span id="session-count-number">—</span>
          <span th:text="#{requests.count.suffix}">eskaera</span>
        </div>
      </div>

      <table class="apps-table">
        <thead>
          <tr>
            <th th:text="#{requests.table.sessionId}">Sesio IDa</th>
            <th th:text="#{requests.table.sourceApp}">Jatorrizko APP</th>
            <th th:text="#{requests.table.destApp}">Helmugako APP</th>
            <th th:text="#{requests.table.securityLevel}">Segurtasun maila</th>
            <th th:text="#{requests.table.startTime}">Hasiera ordua</th>
            <th th:text="#{requests.table.status}">Egoera</th>
            <th th:text="#{requests.table.endTime}">Amaiera ordua</th>
          </tr>
        </thead>
        <tbody id="sessions-table-body">
          <tr class="loading-row">
            <td colspan="7" th:text="#{requests.loading}">Datuak kargatzen...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script type="module">
    import { initLanguageSelector } from '/js/languageSelector.js';
    initLanguageSelector('requests');
  </script>

  <script th:inline="javascript">
    window.requestsI18n = {
      empty: /*[[#{requests.empty}]]*/ "Ez dago sesio eskaerarik",
      error: /*[[#{requests.error}]]*/ "Errorea datuak kargatzean",
      close: /*[[#{requests.detail.close}]]*/ "Itxi",

      // Detail panel labels
      securityLevel: /*[[#{requests.detail.securityLevel}]]*/ "Segurtasun maila",
      status: /*[[#{requests.detail.status}]]*/ "Egoera",
      details: /*[[#{requests.detail.title}]]*/ "Xehetasunak",

      // L1
      l1KmsSrc: /*[[#{requests.detail.l1.kmsSrc}]]*/ "Jatorrizko KMS",
      l1KmsDst: /*[[#{requests.detail.l1.kmsDst}]]*/ "Helmugako KMS",

      // L2
      l2RelayPath: /*[[#{requests.detail.l2.relayPath}]]*/ "Relay bidea",
      l2Hop: /*[[#{requests.detail.l2.hop}]]*/ "Jauzia",

      // L3
      l3Receiver: /*[[#{requests.detail.l3.receiver}]]*/ "Receiver",
      l3Passive: /*[[#{requests.detail.l3.passive}]]*/ "Passive",
      l3Relay: /*[[#{requests.detail.l3.relay}]]*/ "Relay",

      // L4
      l4Initiator: /*[[#{requests.detail.l4.initiator}]]*/ "Initiator",
      l4Responder: /*[[#{requests.detail.l4.responder}]]*/ "Responder"
    };
  </script>

  <script>
    // Orrialdea kargatzean, datuak eskatu
    window.addEventListener('load', () => {
      loadSessions();
    });

    function loadSessions() {
      fetch('/api/sessions')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(sessions => {
          renderSessionsTable(sessions);
          updateSessionCount(sessions.length);
        })
        .catch(error => {
          console.error('Errorea sesioak kargatzean:', error);
          showError();
        });
    }

    function renderSessionsTable(sessions) {
      const tbody = document.getElementById('sessions-table-body');
      tbody.innerHTML = '';

      if (sessions.length === 0) {
        tbody.innerHTML = `
        <tr class="loading-row">
          <td colspan="7">${window.requestsI18n.empty}</td>
        </tr>
      `;
        return;
      }

      sessions.forEach((session, index) => {
        // Errenkada normala
        const row = document.createElement('tr');
        row.style.cursor = 'pointer';
        row.dataset.sessionId = session.sessionId;
        row.dataset.index = index;

        const startTime = session.startTime ? new Date(session.startTime).toLocaleString() : '—';
        const endTime = session.endTime ? new Date(session.endTime).toLocaleString() : '—';

        row.innerHTML = `
        <td>${session.sessionId}</td>
        <td>${session.sourceAppId || '—'}</td>
        <td>${session.destAppId || '—'}</td>
        <td>L${session.securityLevel || '—'}</td>
        <td>${startTime}</td>
        <td>${session.status || '—'}</td>
        <td>${endTime}</td>
      `;

        // Klik event-a
        row.addEventListener('click', () => {
          toggleDetailPanel(row, session.sessionId);
        });

        tbody.appendChild(row);
      });
    }

    function updateSessionCount(count) {
      document.getElementById('session-count-number').textContent = count;
    }

    function showError() {
      const tbody = document.getElementById('sessions-table-body');
      tbody.innerHTML = `
      <tr class="loading-row">
        <td colspan="7">${window.requestsI18n.error}</td>
      </tr>
    `;
    }



    let currentDetailRow = null;  // Detaile panela irekita dagoen errenkada

    function toggleDetailPanel(row, sessionId) {
      // Dagoeneko irekita badago, itxi
      if (currentDetailRow && currentDetailRow.dataset.sessionId === sessionId) {
        closeDetailPanel();
        return;
      }

      // Beste bat irekita badago, itxi lehenik
      if (currentDetailRow) {
        closeDetailPanel();
      }

      // Xehetasunak kargatu eta erakutsi
      loadSessionDetail(row, sessionId);
    }

    function loadSessionDetail(row, sessionId) {
      fetch(`/api/sessions/${sessionId}`)
        .then(response => response.json())
        .then(detail => {
          showDetailPanel(row, detail);
        })
        .catch(error => {
          console.error('Errorea xehetasunak kargatzean:', error);
        });
    }

    function showDetailPanel(row, detail) {
      // Detaile errenkada berria sortu
      const detailRow = document.createElement('tr');
      detailRow.classList.add('detail-row');
      detailRow.dataset.sessionId = detail.sessionId;

      const detailCell = document.createElement('td');
      detailCell.setAttribute('colspan', '7');

      // Edukia sortu
      let html = `
      <div class="detail-panel-content">
        <div class="detail-panel-header">
          <div class="detail-panel-title">
            <div class="detail-panel-dot"></div>
            <span>${detail.sessionId}</span>
          </div>
          <button class="close-btn" onclick="closeDetailPanel()">
            ${window.requestsI18n.close || 'Itxi'}
          </button>
        </div>
        
        <div class="section-label">${window.requestsI18n.securityLevel}: L${detail.securityLevel}</div>
        <div class="section-label">${window.requestsI18n.status}: ${detail.status}</div>
        <div style="margin: 20px 0;">
          <div class="section-label">Topologia:</div>
          <div id="topology-graph-container" style="width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);"></div>
        </div>
    `;

      // Xehetasunak gehitu status-en arabera
      if (detail.status === 'Level configured for init' ||
        detail.status === 'SLA assigned for target' ||
        detail.status === 'Level configured for target') {

        html += `<div class="section-label" style="margin-top: 20px;">${window.requestsI18n.details}</div>`;

        // L1
        if (detail.securityLevel === 1 && detail.kmsSrcId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l1KmsSrc}</td><td>${detail.kmsSrcId}</td></tr>
            <tr><td>${window.requestsI18n.l1KmsDst}</td><td>${detail.kmsDstId}</td></tr>
          </table>
        `;
        }

        // L2
        if (detail.securityLevel === 2 && detail.l2Hops) {
          html += `<div style="margin-top: 10px;"><strong>${window.requestsI18n.l2RelayPath}:</strong></div>`;
          detail.l2Hops.forEach(hop => {
            html += `
            <div class="kms-card">
              <div class="kms-id">${window.requestsI18n.l2Hop} ${hop.hopOrder}: ${hop.kmsId}</div>
            </div>
          `;
          });
        }

        // L3
        if (detail.securityLevel === 3 && detail.receiverId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l3Receiver}</td><td>${detail.receiverId}</td></tr>
            <tr><td>${window.requestsI18n.l3Passive}</td><td>${detail.passiveId}</td></tr>
            <tr><td>${window.requestsI18n.l3Relay}</td><td>${detail.relayId}</td></tr>
          </table>
        `;
        }

        // L4
        if (detail.securityLevel === 4 && detail.initiatorId) {
          html += `
          <table class="info-table">
            <tr><td>${window.requestsI18n.l4Initiator}</td><td>${detail.initiatorId}</td></tr>
            <tr><td>${window.requestsI18n.l4Responder}</td><td>${detail.responderId}</td></tr>
          </table>
        `;
        }
      }

      html += '</div>';
      detailCell.innerHTML = html;
      detailRow.appendChild(detailCell);

      // Errenkadaren ondoren txertatu
      row.parentNode.insertBefore(detailRow, row.nextSibling);

      // Errenkada hautatu bezala markatu
      row.classList.add('selected');

      // Gorde erreferentzia
      currentDetailRow = detailRow;
      if (detail.topology) {
        setTimeout(() => {
          renderTopologyGraph(detail);
        }, 100);
      }
    }

    function closeDetailPanel() {
      if (currentDetailRow) {
        // Errenkada aurkitu eta 'selected' klase kendu
        const sessionId = currentDetailRow.dataset.sessionId;
        const sessionRow = document.querySelector(`tr[data-session-id="${sessionId}"]`);
        if (sessionRow) {
          sessionRow.classList.remove('selected');
        }

        // Detaile panela kendu
        currentDetailRow.remove();
        currentDetailRow = null;
      }
    }
    /**
     * Topology datuak prozesatu eta Site-en arabera antolatu
     */
    function processTopologyData(topology) {
      const siteMap = new Map();

      // Site nodoak bilatu
      topology.nodes
        .filter(n => n.node_type === 'CN' || n.node_type === 'QN')
        .forEach(site => {
          siteMap.set(site.id, {
            id: site.id,
            type: site.node_type,
            vkms: site.vKMS,
            kms: []
          });
        });

      // KMS nodoak Site-ei esleitu
      topology.nodes
        .filter(n => n.node_type === 'KMS')
        .forEach(kms => {
          const site = siteMap.get(kms.site);
          if (site) {
            site.kms.push(kms.id);
          }
        });

      return Array.from(siteMap.values());
    }
    function renderTopologyGraph(detail) {
      const container = document.getElementById('topology-graph-container');
      if (!container) return;

      const topology = detail.topology;
      if (!topology || !topology.nodes) return;

      // Garbitu aurreko SVG-a
      d3.select('#topology-graph-container').selectAll('*').remove();

      // Datuak prozesatu
      const sites = processTopologyData(topology);

      const width = container.clientWidth;
      const height = 500;

      // SVG sortu
      const svg = d3.select('#topology-graph-container')
        .append('svg')
        .attr('width', width)
        .attr('height', height);

      const g = svg.append('g');

      // Zoom
      const zoom = d3.zoom()
        .scaleExtent([0.5, 2])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom);

      // Classical links marraztu (Site artean)
      const classicalLinks = (topology['classical-links'] || []).map(link => ({
        source: link.source,
        target: link.target,
        type: 'classical'
      }));

      // Quantum links prozesatu (KMS artean -> Site-etara mapatu)
      const quantumLinks = (topology.links || [])
        .filter(link => link.quantum_link === true)
        .map(link => {
          // KMS-ak zein Site-tan dauden aurkitu
          const sourceKMS = topology.nodes.find(n => n.id === link.source);
          const targetKMS = topology.nodes.find(n => n.id === link.target);

          if (sourceKMS && targetKMS) {
            return {
              source: sourceKMS.site,
              target: targetKMS.site,
              type: 'quantum',
              sourceKMS: link.source,
              targetKMS: link.target
            };
          }
          return null;
        })
        .filter(link => link !== null);

      // Lotura guztiak batu
      const allLinks = [...classicalLinks, ...quantumLinks];

      console.log('Sites:', sites.map(s => s.id));
      console.log('Classical Links:', classicalLinks);
      console.log('Quantum Links:', quantumLinks);

      const simulation = d3.forceSimulation(sites)
        .force('link', d3.forceLink(allLinks).id(d => d.id).distance(300).strength(0.8))
        .force('charge', d3.forceManyBody().strength(-3000))
        .force('center', d3.forceCenter(width / 2, height / 2).strength(0.05))
        .force('collision', d3.forceCollide().radius(100))
        .force('x', d3.forceX(width / 2).strength(0.02))
        .force('y', d3.forceY(height / 2).strength(0.02))
        .velocityDecay(0.5)
        .alpha(1.5)
        .alphaDecay(0.015);

      // Classical links (lerro zuzenak)
      const classicalLinksSel = g.append('g')
        .attr('class', 'classical-links-group')
        .selectAll('line')
        .data(classicalLinks)
        .enter()
        .append('line')
        .attr('class', 'classical-link')
        .attr('stroke', '#3b82f6')
        .attr('stroke-width', 4)
        .attr('stroke-opacity', 0.4);

      // Quantum links (kurbak)
      const quantumLinksSel = g.append('g')
        .attr('class', 'quantum-links-group')
        .selectAll('path')
        .data(quantumLinks)
        .enter()
        .append('path')
        .attr('class', 'quantum-link')
        .attr('fill', 'none')
        .attr('stroke', '#a855f7')
        .attr('stroke-width', 5)
        .attr('stroke-opacity', 0.6)
        .attr('stroke-dasharray', '5,5');

      // Site kaxak
      // Drag behavior definitu
      const drag = d3.drag()
        .on('start', function (event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on('drag', function (event, d) {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on('end', function (event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        });

      // Site kaxak
      const siteGroups = g.append('g')
        .selectAll('g')
        .data(sites)
        .enter()
        .append('g')
        .attr('class', 'site-group')
        .style('cursor', 'grab')
        .call(drag);

      // Site kaxak (errektangelua)
      siteGroups.append('rect')
        .attr('class', 'site-box')
        .attr('width', 150)
        .attr('height', 100)
        .attr('x', -75)
        .attr('y', -50)
        .attr('rx', 8)
        .attr('fill', d => d.type === 'QN' ? '#f5f3ff' : '#eff6ff')
        .attr('stroke', d => d.type === 'QN' ? '#7c3aed' : '#2563eb')
        .attr('stroke-width', 2);

      // Site izena (goian)
      siteGroups.append('text')
        .attr('class', 'site-label')
        .attr('x', 0)
        .attr('y', -30)
        .attr('text-anchor', 'middle')
        .attr('font-size', '12px')
        .attr('font-weight', '600')
        .attr('fill', '#1a1d2e')
        .text(d => d.id);

      // vKMS (eskuinean)
      siteGroups.append('circle')
        .attr('class', 'vkms-node')
        .attr('data-site-id', d => d.id)  // ← HAU BADAGO?
        .attr('cx', 35)
        .attr('cy', 15)
        .attr('r', 18)
        .attr('fill', '#d1fae5')
        .attr('stroke', '#10b981')
        .attr('stroke-width', 2);

      siteGroups.append('text')
        .attr('x', 35)
        .attr('y', 19)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('font-size', '7px')
        .attr('font-weight', '700')
        .attr('fill', '#000000')
        .attr('pointer-events', 'none')
        .text(d => d.vkms);

      // KMS-ak (ezkerrean, goitik hasita)
      siteGroups.each(function (d) {
        const group = d3.select(this);
        const kmsCount = d.kms.length;

        d.kms.forEach((kmsId, i) => {
          // Hasi goitik (-20) eta behera joan
          const yPos = -20 + (i * 35);

          group.append('circle')
            .attr('class', 'kms-node')
            .attr('data-kms-id', kmsId)
            .attr('cx', -35)  // Ezkerrean
            .attr('cy', yPos + 15)
            .attr('r', 18)
            .attr('fill', '#fef3c7')
            .attr('stroke', '#f59e0b')
            .attr('stroke-width', 2);

          group.append('text')
            .attr('x', -35)
            .attr('y', yPos + 19)
            .attr('text-anchor', 'middle')
            .attr('font-size', '7px')
            .attr('font-weight', '600')
            .attr('fill', '#78350f')
            .text(kmsId);
        });
      });

      // Simulazioa tick
      simulation.on('tick', () => {
        // Classical links: lerro zuzenak
        classicalLinksSel
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        // Quantum links: kurbak
        quantumLinksSel
          .attr('d', d => {
            const dx = d.target.x - d.source.x;
            const dy = d.target.y - d.source.y;
            const dr = Math.sqrt(dx * dx + dy * dy) * 1.5; // Kurba erradioa

            return `M ${d.source.x},${d.source.y} A ${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
          });

        siteGroups.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Gelditu 2 segundo ondoren
      setTimeout(() => {
        simulation.stop();
        // Nabarmentzeak aplikatu
        applyHighlights(detail, g, topology);
      }, 2000);

      // Legenda gehitu
      const legend = svg.append('g')
        .attr('class', 'topology-legend')
        .attr('transform', 'translate(20, 20)');

      // Classical link adibidea
      legend.append('line')
        .attr('x1', 0)
        .attr('y1', 0)
        .attr('x2', 40)
        .attr('y2', 0)
        .attr('stroke', '#3b82f6')
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 0.6);

      legend.append('text')
        .attr('x', 50)
        .attr('y', 4)
        .attr('font-size', '12px')
        .attr('fill', '#000')
        .text('Classical Link');

      // Quantum link adibidea
      legend.append('line')
        .attr('x1', 0)
        .attr('y1', 25)
        .attr('x2', 40)
        .attr('y2', 25)
        .attr('stroke', '#a855f7')
        .attr('stroke-width', 3)
        .attr('stroke-opacity', 0.6)
        .attr('stroke-dasharray', '5,5');

      legend.append('text')
        .attr('x', 50)
        .attr('y', 29)
        .attr('font-size', '12px')
        .attr('fill', '#000')
        .text('Quantum Link');
    }
function resetHighlights(g) {
      // KMS nodoak
      g.selectAll('.kms-node')
        .attr('stroke', '#f59e0b')
        .attr('stroke-width', 2)
        .style('filter', 'none')
        .style('opacity', 1);
      
      // vKMS nodoak
      g.selectAll('.vkms-node')
        .attr('stroke', '#10b981')
        .attr('stroke-width', 2)
        .style('filter', 'none')
        .style('opacity', 1);
      
      // Classical links
      g.selectAll('.classical-link')
        .attr('stroke', '#3b82f6')
        .attr('stroke-width', 4)
        .attr('stroke-opacity', 0.4);
      
      // Quantum links
      g.selectAll('.quantum-link')
        .attr('stroke', '#a855f7')
        .attr('stroke-width', 5)
        .attr('stroke-opacity', 0.6);
      
      // Kendu highlight labels
      g.selectAll('.highlight-label').remove();
    }

    /**
     * Lausotu elementu guztiak (parte hartzen ez dutenak)
     */
    function dimAll(g) {
      // Nodoak lausotu
      g.selectAll('.kms-node').style('opacity', 0.15);
      g.selectAll('.vkms-node').style('opacity', 0.15);
      
      // Site kaxak lausotu
      g.selectAll('.site-box')
        .style('opacity', 0.3)
        .style('filter', 'blur(1px)');
      
      // Site izenak lausotu
      g.selectAll('.site-label').style('opacity', 0.3);
      
      // Loturak lausotu
      g.selectAll('.classical-link')
        .attr('stroke-opacity', 0.08);
      
      g.selectAll('.quantum-link')
        .attr('stroke-opacity', 0.08);
    }

    function applyHighlights(detail, g, topology) {
      const secLevel = detail.securityLevel;

      if (secLevel === 1) {
        highlightL1(detail, g, topology);
      } else if (secLevel === 2) {
        highlightL2(detail, g, topology);
      } else if (secLevel === 3) {
        highlightL3(detail, g, topology);
      } else if (secLevel === 4) {
        highlightL4(detail, g, topology);
      }
    }

    function highlightL1(detail, g, topology) {
      console.log('=== L1 DEBUG ===');
      console.log('kmsSrcId:', detail.kmsSrcId);
      console.log('kmsDstId:', detail.kmsDstId);
      
      // Lausotu guztiak
      dimAll(g);
      
      const kmsSrc = detail.kmsSrcId;
      const kmsDst = detail.kmsDstId;

      if (kmsSrc) {
        // Birgaitu nodoa
        g.selectAll('.kms-node')
          .filter(function() { return d3.select(this).attr('data-kms-id') === kmsSrc; })
          .style('opacity', 1);
        
        highlightKMSNode(g, kmsSrc, '#3b82f6', 'Source');
        
        const srcNode = topology.nodes.find(n => n.id === kmsSrc);
        if (srcNode) {
          const srcSite = srcNode.site;
          
          // Birgaitu Site-a
          g.selectAll('.site-group')
            .filter(d => d.id === srcSite)
            .selectAll('.site-box, .site-label')
            .style('opacity', 1)
            .style('filter', 'none');
          
          const dstNode = topology.nodes.find(n => n.id === kmsDst);
          if (dstNode) {
            const dstSite = dstNode.site;
            
            // Birgaitu helmuga Site-a
            g.selectAll('.site-group')
              .filter(d => d.id === dstSite)
              .selectAll('.site-box, .site-label')
              .style('opacity', 1)
              .style('filter', 'none');
            
            highlightQuantumLink(g, srcSite, dstSite, '#10b981');
          }
        }
      }
      
      if (kmsDst) {
        // Birgaitu nodoa
        g.selectAll('.kms-node')
          .filter(function() { return d3.select(this).attr('data-kms-id') === kmsDst; })
          .style('opacity', 1);
        
        highlightKMSNode(g, kmsDst, '#10b981', 'Dest');
      }
    }

    function highlightL2(detail, g, topology) {
      if (!detail.l2Hops) return;

      // Lausotu guztiak
      dimAll(g);

      const colors = ['#3b82f6', '#eab308', '#10b981'];
      const labels = ['Hop 1', 'Hop 2', 'Hop 3'];

      detail.l2Hops.forEach((hop, i) => {
        // Birgaitu nodoa
        g.selectAll('.kms-node')
          .filter(function() { return d3.select(this).attr('data-kms-id') === hop.kmsId; })
          .style('opacity', 1);
        
        const color = colors[i % colors.length];
        const label = labels[i] || `Hop ${i + 1}`;
        highlightKMSNode(g, hop.kmsId, color, label);
        
        // Birgaitu Site-a
        const node = topology.nodes.find(n => n.id === hop.kmsId);
        if (node) {
          g.selectAll('.site-group')
            .filter(d => d.id === node.site)
            .selectAll('.site-box, .site-label')
            .style('opacity', 1)
            .style('filter', 'none');
        }
      });

      // Quantum links nabarmendu
      for (let i = 0; i < detail.l2Hops.length - 1; i++) {
        const srcKmsId = detail.l2Hops[i].kmsId;
        const dstKmsId = detail.l2Hops[i + 1].kmsId;

        const srcNode = topology.nodes.find(n => n.id === srcKmsId);
        const dstNode = topology.nodes.find(n => n.id === dstKmsId);

        if (srcNode && dstNode && srcNode.site !== dstNode.site) {
          const color = colors[i % colors.length];
          highlightQuantumLink(g, srcNode.site, dstNode.site, color);
        }
      }
    }
    function findShortestPath(classicalLinks, startSite, endSite) {
      if (startSite === endSite) return [startSite];

      // Grafo eraiki (adjacency list)
      const graph = new Map();

      classicalLinks.forEach(link => {
        const src = typeof link.source === 'object' ? link.source.id : link.source;
        const tgt = typeof link.target === 'object' ? link.target.id : link.target;

        if (!graph.has(src)) graph.set(src, []);
        if (!graph.has(tgt)) graph.set(tgt, []);

        graph.get(src).push(tgt);
        graph.get(tgt).push(src);
      });

      // BFS algoritmo
      let bfsQueue = [];  // ← let erabili
      bfsQueue.push([startSite]);  // ← push erabili
      const visited = new Set([startSite]);

      while (bfsQueue.length > 0) {
        const path = bfsQueue[0];  // ← lehenengo elementua lortu
        bfsQueue = bfsQueue.slice(1);  // ← lehenengo elementua kendu (shift ordez)
        
        const current = path[path.length - 1];

        if (current === endSite) {
          console.log('Path found:', path);
          return path;
        }

        const neighbors = graph.get(current) || [];
        for (const neighbor of neighbors) {
          if (!visited.has(neighbor)) {
            visited.add(neighbor);
            bfsQueue.push([...path, neighbor]);
          }
        }
      }

      console.log('No path found from', startSite, 'to', endSite);
      return null;
    }
    function highlightL3(detail, g, topology) {
      const receiverSite = findSiteByVkms(topology, detail.receiverId);
      const passiveSite = findSiteByVkms(topology, detail.passiveId);
      const relaySite = findSiteByVkms(topology, detail.relayId);

      console.log('=== L3 DEBUG ===');
      console.log('Receiver:', receiverSite);
      console.log('Passive:', passiveSite);
      console.log('Relay:', relaySite);

      // Lausotu guztiak
      dimAll(g);

      // Birgaitu parte hartzen duten Site-ak
      [receiverSite, passiveSite, relaySite].forEach(siteId => {
        if (siteId) {
          g.selectAll('.site-group')
            .filter(d => d.id === siteId)
            .selectAll('.site-box, .site-label')
            .style('opacity', 1)
            .style('filter', 'none');
          
          // vKMS birgaitu
          g.selectAll('.vkms-node')
            .filter(function() { return d3.select(this).attr('data-site-id') === siteId; })
            .style('opacity', 1);
        }
      });

      // Rolak konbinatu
      const siteRoles = {};

      if (receiverSite) {
        if (!siteRoles[receiverSite]) siteRoles[receiverSite] = [];
        siteRoles[receiverSite].push({ role: 'Receiver', color: '#3b82f6' });
      }
      if (passiveSite) {
        if (!siteRoles[passiveSite]) siteRoles[passiveSite] = [];
        siteRoles[passiveSite].push({ role: 'Passive', color: '#eab308' });
      }
      if (relaySite) {
        if (!siteRoles[relaySite]) siteRoles[relaySite] = [];
        siteRoles[relaySite].push({ role: 'Relay', color: '#10b981' });
      }

      // vKMS-ak nabarmendu
      Object.entries(siteRoles).forEach(([siteId, roles]) => {
        const combinedLabel = roles.map(r => r.role).join(' + ');
        const primaryColor = roles[0].color;
        highlightVKMSNode(g, siteId, primaryColor, combinedLabel);
      });

      // Classical links lortu
      const classicalLinks = (topology['classical-links'] || []).map(link => ({
        source: link.source,
        target: link.target
      }));

      // LOTURAK NABARMENDU
      if (receiverSite && relaySite && receiverSite !== relaySite) {
        const path = findShortestPath(classicalLinks, receiverSite, relaySite);
        console.log('Receiver → Relay path:', path);

        if (path) {
          for (let i = 0; i < path.length - 1; i++) {
            highlightClassicalLink(g, path[i], path[i + 1], '#3b82f6');
            
            // Birgaitu bitarteko Site-ak ere
            [path[i], path[i + 1]].forEach(siteId => {
              g.selectAll('.site-group')
                .filter(d => d.id === siteId)
                .selectAll('.site-box, .site-label')
                .style('opacity', 1)
                .style('filter', 'none');
            });
          }
        }
      }

      if (receiverSite && passiveSite && receiverSite !== passiveSite) {
        const path = findShortestPath(classicalLinks, receiverSite, passiveSite);
        console.log('Receiver → Passive path:', path);

        if (path) {
          for (let i = 0; i < path.length - 1; i++) {
            highlightClassicalLink(g, path[i], path[i + 1], '#eab308');
            
            // Birgaitu bitarteko Site-ak
            [path[i], path[i + 1]].forEach(siteId => {
              g.selectAll('.site-group')
                .filter(d => d.id === siteId)
                .selectAll('.site-box, .site-label')
                .style('opacity', 1)
                .style('filter', 'none');
            });
          }
        }
      }

      if (relaySite && passiveSite && relaySite !== passiveSite) {
        console.log('Relay → Passive: quantum direct');
        highlightQuantumLink(g, relaySite, passiveSite, '#10b981');
      }
    }

    function highlightL4(detail, g, topology) {
      const initiatorSite = findSiteByVkms(topology, detail.initiatorId);
      const responderSite = findSiteByVkms(topology, detail.responderId);

      // Lausotu guztiak
      dimAll(g);

      if (initiatorSite) {
        // Birgaitu Site-a
        g.selectAll('.site-group')
          .filter(d => d.id === initiatorSite)
          .selectAll('.site-box, .site-label')
          .style('opacity', 1)
          .style('filter', 'none');
        
        // vKMS birgaitu
        g.selectAll('.vkms-node')
          .filter(function() { return d3.select(this).attr('data-site-id') === initiatorSite; })
          .style('opacity', 1);
        
        highlightVKMSNode(g, initiatorSite, '#3b82f6', 'Initiator');
      }
      
      if (responderSite) {
        // Birgaitu Site-a
        g.selectAll('.site-group')
          .filter(d => d.id === responderSite)
          .selectAll('.site-box, .site-label')
          .style('opacity', 1)
          .style('filter', 'none');
        
        // vKMS birgaitu
        g.selectAll('.vkms-node')
          .filter(function() { return d3.select(this).attr('data-site-id') === responderSite; })
          .style('opacity', 1);
        
        highlightVKMSNode(g, responderSite, '#10b981', 'Responder');
      }

      // Classical link nabarmendu
      if (initiatorSite && responderSite) {
        highlightClassicalLink(g, initiatorSite, responderSite, '#3b82f6');
      }
    }

    // Laguntzaileak
    function highlightKMSNode(g, kmsId, color, label) {
      g.selectAll('.kms-node')
        .filter(function () {
          return d3.select(this).attr('data-kms-id') === kmsId;
        })
        .attr('stroke', color)
        .attr('stroke-width', 3)
        .style('filter', `drop-shadow(0 0 6px ${color}99)`);

      // Label gehitu
      const node = g.selectAll('.kms-node')
        .filter(function () {
          return d3.select(this).attr('data-kms-id') === kmsId;
        });

      if (!node.empty()) {
        const cx = parseFloat(node.attr('cx'));
        const cy = parseFloat(node.attr('cy'));

        node.each(function () {
          const parent = this.parentNode;
          d3.select(parent)
            .append('text')
            .attr('class', 'highlight-label')
            .attr('x', cx + 20)
            .attr('y', cy + 4)
            .attr('font-size', '10px')
            .attr('font-weight', '600')
            .attr('fill', color)
            .text(label);
        });
      }
    }

    function highlightSiteBox(g, siteId, color, label) {
      g.selectAll('.site-group')
        .filter(d => d.id === siteId)
        .select('.site-box')
        .attr('stroke', color)
        .attr('stroke-width', 4)
        .style('filter', `drop-shadow(0 0 10px ${color}99)`);

      // Label gehitu Site izenaren ondoan
      g.selectAll('.site-group')
        .filter(d => d.id === siteId)
        .append('text')
        .attr('class', 'highlight-label')
        .attr('x', 0)
        .attr('y', -45)
        .attr('text-anchor', 'middle')
        .attr('font-size', '11px')
        .attr('font-weight', '700')
        .attr('fill', color)
        .text(`[${label}]`);
    }

    function findSiteByVkms(topology, vkmsId) {
      const node = topology.nodes.find(n => n.vKMS === vkmsId && (n.node_type === 'CN' || n.node_type === 'QN'));
      return node ? node.id : null;
    }

    function highlightVKMSNode(g, siteId, color, label) {
      console.log('=== highlightVKMSNode DEBUG ===');
      console.log('Looking for siteId:', siteId);

      const allVKMS = g.selectAll('.vkms-node');
      console.log('Total vKMS nodes:', allVKMS.size());

      allVKMS.each(function () {
        const attrValue = d3.select(this).attr('data-site-id');
        console.log('vKMS node has data-site-id:', attrValue);
      });

      const vkmsNode = g.selectAll('.vkms-node')
        .filter(function () {
          const attrValue = d3.select(this).attr('data-site-id');
          console.log('Comparing:', attrValue, '===', siteId, '?', attrValue === siteId);
          return attrValue === siteId;
        });

      console.log('Matched vKMS nodes:', vkmsNode.size());

      vkmsNode
        .attr('stroke', color)
        .attr('stroke-width', 3)
        .style('filter', `drop-shadow(0 0 8px ${color}99)`);

      if (!vkmsNode.empty() && label) {
        const cx = parseFloat(vkmsNode.attr('cx'));
        const cy = parseFloat(vkmsNode.attr('cy'));

        vkmsNode.each(function () {
          const parent = this.parentNode;
          d3.select(parent)
            .append('text')
            .attr('class', 'highlight-label')
            .attr('x', cx + 25)
            .attr('y', cy + 4)
            .attr('font-size', '10px')
            .attr('font-weight', '600')
            .attr('fill', color)
            .text(label);
        });
      }
    }
    // Classical link nabarmendu
    function highlightClassicalLink(g, sourceSite, targetSite, color) {
      console.log('=== highlightClassicalLink DEBUG ===');
      console.log('Looking for:', sourceSite, '↔', targetSite);

      const matched = g.selectAll('.classical-link')
        .filter(function () {
          const line = d3.select(this);
          const data = line.datum();

          // D3-k source/target objektu bihur ditzake
          const srcId = typeof data.source === 'object' ? data.source.id : data.source;
          const tgtId = typeof data.target === 'object' ? data.target.id : data.target;

          console.log('Checking classical link:', srcId, '↔', tgtId);

          return (srcId === sourceSite && tgtId === targetSite) ||
            (srcId === targetSite && tgtId === sourceSite);
        });

      console.log('Matched classical links:', matched.size());

      matched
        .attr('stroke', color)
        .attr('stroke-width', 6)
        .attr('stroke-opacity', 0.9)
        .style('filter', `drop-shadow(0 0 8px ${color}99)`);
    }

    // Quantum link nabarmendu
    function highlightQuantumLink(g, sourceSite, targetSite, color) {
      console.log('=== highlightQuantumLink DEBUG ===');
      console.log('Looking for:', sourceSite, '↔', targetSite);

      const matched = g.selectAll('.quantum-link')
        .filter(function () {
          const path = d3.select(this);
          const data = path.datum();

          // D3-k source/target objektu bihur ditzake
          const srcId = typeof data.source === 'object' ? data.source.id : data.source;
          const tgtId = typeof data.target === 'object' ? data.target.id : data.target;

          console.log('Checking quantum link:', srcId, '↔', tgtId);

          return (srcId === sourceSite && tgtId === targetSite) ||
            (srcId === targetSite && tgtId === sourceSite);
        });

      console.log('Matched quantum links:', matched.size());

      matched
        .attr('stroke', color)
        .attr('stroke-width', 7)
        .attr('stroke-opacity', 0.9)
        .style('filter', `drop-shadow(0 0 10px ${color}99)`);
    }

  </script>
