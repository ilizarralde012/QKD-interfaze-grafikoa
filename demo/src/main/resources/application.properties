spring.application.name=demo
server.port=8443

# HTTPS konfigurazioa
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# DATASOURCE (MYSQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/mydb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=springuser
spring.datasource.password=Spring@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# LOGGING SQL (OPCIONAL PERO ÚTIL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo.controller_PL=DEBUG

# ========================================
# LDAP KONFIGURAZIOA (EHU)
# ========================================

# LDAP zerbitzaria (SSL)
spring.ldap.urls=ldaps://ldap.ehu.es:636

# Base DN
spring.ldap.base=ou=people,dc=ehu,dc=es

# Erabiltzaile bilaketa
ldap.user.search.base=
ldap.user.search.filter=(uid={0})