<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quantum Network Topology</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #fcfcfc; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Título Estilo Banner */
        h1 { text-align: center; border: 1.5px solid #444; padding: 15px; background: #f8f9fa; border-radius: 10px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Área del Mapa (Inmóvil) */
        #mynetwork { height: 450px; border: 1px solid #eee; margin-bottom: 30px; background: #ffffff; cursor: default; }

        /* Panel de Información inferior */
        #info-panel { border: 2px dashed #ccc; padding: 20px; min-height: 120px; background: #fafafa; border-radius: 8px; margin-bottom: 25px; }
        #placeholder-text { color: #888; text-align: center; font-style: italic; margin-top: 30px; }
        
        /* Estilo de la Tabla */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; animation: fadeIn 0.5s; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; width: 30%; font-weight: bold; color: #555; }
        tr:hover { background-color: #f9f9f9; }

        /* Botones de Navegación */
        .nav-buttons { display: flex; gap: 15px; justify-content: flex-start; }
        .btn { padding: 12px 25px; border: 1px solid #444; background: #f0f0f0; cursor: pointer; border-radius: 6px; 
               text-decoration: none; color: #333; font-weight: bold; transition: all 0.2s; }
        .btn:hover { background: #e0e0e0; border-color: #000; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Network Topology</h1>

    <div id="mynetwork"></div>

    <div id="info-panel">
        <div id="placeholder-text">Haz clic en un nodo o enlace para ver los detalles técnicos...</div>
        <div id="detail-content" style="display:none;">
            <h3 id="detail-title" style="margin-top:0; color: #2c3e50;">Detalles</h3>
            <table id="detail-table">
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div class="nav-buttons">
        <a href="/requests" class="btn">See requests</a>
        <a href="/apps" class="btn">See apps</a>
    </div>
</div>

<script src="/js/network-logic.js"></script>
</body>
</html>
